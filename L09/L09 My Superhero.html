<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L09 My Superhero</title>

    <!--internal CSS-->
    <style>
        /* Typography - font, size, weight, colour for the whole page */
        body {
            background-color: darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Typography + Text Shadow - big bold title with an orange */
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 5px 5px orange;
        }

        /* Typography + Text Transform -tagline becomes Title Case */
        .tagline {
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        /* Text Transform + Text Decoration - selection headings in CAPS with underline */
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        /* Typography - powers stand out in bold green */
        .power {
            font-weight: bold;
            color: lightgreen;
        }

        /* Text Decoration - weaknesses are crossed out */
        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        /* Transform - the badge is titled to the slide */
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        /* Typography - footer text */
        .made-by {
            color: coral;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a schhol bus</p>

    <h2 class="label">weakness</h2>
    <p class="weakness">Maths homework</p>
    <p class="weakness">Brocoli</p>

    <p class="badge">Top Hero</p>

    <p class="made-by">Created by Naga</p>
</body>
</html>
