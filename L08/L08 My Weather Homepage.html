<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Weather Homepage</title>

    <style>
        /* Universal selector: applies basic settings to full page*/
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body background uses colour, image pattern, repeat, position, and attachment */
        body {
            background-color: #87ceeb;
            background-image: radial-gradient(circle, white 2px, transparent 3px);
            background-size: 40px 40px;
            background-repeat: repeat;
            background-position: top center;
            background-attachment: fixed;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: white;
        }

        .subtitle {
            font-size: 18px;
            color: #f0f8ff;
        }

        .weather-card {
            width: 400px;
            border: 3px solid white;
            border-radius: 20px;
            background-image: linear-gradient(to bottom right, #1e90ff, #87cefa);
        }

        .weather-icon {
            font-size: 70px;
            animation: floatCloud 3s infinite alternate;
        }

        #temperature {
            font-size: 48px;
            font-weight: bold;
            color: #fffcad;
        }
    </style>
</head>
<body>
    
</body>
</html>
